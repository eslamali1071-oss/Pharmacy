<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>إدارة صيدلية د/أسامه</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F7F9FB;--sf:#fff;--ink:#233143;--mut:#6A7B8C;--pri:#2F6DB5;--on:#fff;--line:#E6ECF2;--star:#D99A00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Cairo,system-ui,Tahoma,sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:9;padding:18px 20px 0}
h1{margin:0;font-size:26px;font-weight:800;color:var(--pri)}
.sub{margin:0 0 12px;color:var(--mut);font-size:14px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;margin:0 0 10px}
#srch{border-radius:26px;padding:12px 20px;margin:0}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 20px 12px}
.chip{flex:none;font:inherit;font-size:14px;color:var(--mut);background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:4px 16px;cursor:pointer}
.chip.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
main{max-width:640px;margin:0 auto}
.row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.th{flex:none;width:68px;height:68px;border-radius:20px;display:grid;place-items:center}
.rt{display:flex;flex-direction:column;min-width:0;flex:1}
.rt b{font-weight:600}
.rt small{color:var(--mut);font-size:13px;line-height:1.5}
.st{color:var(--star);font-size:13px}
.rp{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.rp b{font-size:15px}
.add,.main{font:inherit;font-weight:600;background:var(--pri);color:var(--on);border:0;border-radius:20px;padding:5px 18px;cursor:pointer}
.main{width:100%;padding:12px;font-size:17px;border-radius:14px}
.main.sm{width:auto;border-radius:20px;padding:8px 22px;font-size:16px}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:34px;height:34px;font-size:20px;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:50%;cursor:pointer}
.tot{display:flex;justify-content:space-between;padding:18px 20px;font-size:20px}
form{padding:0 20px}
form small{display:block;text-align:center;color:var(--mut);margin-top:8px}
.empty,.note{color:var(--mut);padding:20px;text-align:center}
.done{padding:48px 20px;text-align:center}
.tabs{position:fixed;bottom:0;inset-inline:0;display:flex;background:rgba(255,255,255,.94);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
.tabs button{flex:1;font:inherit;font-weight:600;color:var(--mut);background:none;border:0;padding:14px;cursor:pointer}
.tabs button.on{color:var(--pri)}
#bd{background:var(--pri);color:var(--on);border-radius:10px;padding:0 7px;font-size:13px;margin-inline-start:4px}
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
.bg{position:absolute;inset:0;background:rgba(20,30,45,.4)}
.pan{position:relative;display:flex;flex-direction:column;width:100%;max-width:640px;margin:0 auto;max-height:88%;background:var(--bg);border-radius:26px 26px 0 0}
.in{overflow-y:auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.x{position:absolute;top:12px;inset-inline-end:14px;z-index:2;width:38px;height:38px;font-size:24px;line-height:1;color:var(--mut);background:var(--sf);border:1px solid var(--line);border-radius:50%;cursor:pointer}
.hd{display:flex;gap:14px;align-items:center;padding-inline-end:44px;margin-bottom:14px}
.hd h2{margin:0;font-size:20px;line-height:1.4}
.hd p{margin:4px 0 0;color:var(--mut);font-size:14px}
.seg{display:flex;gap:10px;margin-bottom:14px}
.seg button{flex:1;font:inherit;font-weight:600;color:var(--ink);background:var(--sf);border:1.5px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.4}
.seg button small{color:var(--mut);font-weight:400}
.seg button.on{border-color:var(--pri);background:#EAF1F9;color:var(--pri)}
.rp2{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:600}
.pan h3{margin:22px 0 6px;font-size:17px}
.rev{padding:10px 0;border-bottom:1px solid var(--line)}
.rev p{margin:2px 0 0}
.pick{display:flex;gap:4px;margin-bottom:6px}
.pick button{font-size:30px;background:none;border:0;color:var(--line);cursor:pointer;padding:0 2px}
.pick button.on{color:var(--star)}
#toast{position:fixed;bottom:96px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:#fff;padding:8px 18px;border-radius:20px;z-index:30;font-size:15px}
#toast[hidden]{display:none}
.chips{padding:10px 0 10px}
.chips::after{content:"";flex:none;width:12px}
.cnt{margin:0;padding:6px 20px;color:var(--mut);font-size:13px}
.rt small bdi{unicode-bidi:isolate}
.sc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin:0 0 14px;border-top:1px solid var(--line)}
.meta div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.meta span{color:var(--mut);flex:none}
.meta b{font-weight:600;text-align:end}
.fine{color:var(--mut);font-size:13px;text-align:center;padding:12px 20px 0}
.ban{margin:8px 20px 0;padding:10px 14px;border-radius:14px;background:#EAF1F9;color:var(--pri);font-size:14px;font-weight:600}
.rx{display:block;margin:10px 20px 0;text-align:center;border:1.5px dashed var(--pri);color:var(--pri);border-radius:14px;padding:8px;font-weight:600;cursor:pointer}
.opt{display:flex;gap:10px;margin:0 0 10px}
.opt label{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:8px;text-align:center;background:var(--sf);cursor:pointer;font-size:14px}
.opt input{display:none}
.opt label.on{border-color:var(--pri);background:#EAF1F9;color:var(--pri);font-weight:600}
.sum{display:flex;justify-content:space-between}
.pill{display:inline-block;border-radius:12px;padding:0 10px;font-size:13px;background:#EAF1F9;color:var(--pri);font-weight:600}
.card{margin:12px 20px;padding:14px;background:var(--sf);border:1px solid var(--line);border-radius:16px}
.card h4{margin:0 0 4px;font-size:16px}
.card small{color:var(--mut)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btns button,.btns a{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--pri);color:var(--pri);background:none;border-radius:16px;padding:3px 12px;cursor:pointer;text-decoration:none}
.btns .on{background:var(--pri);color:var(--on)}
.sub2{display:flex;gap:8px;padding:10px 20px}
.ed{display:flex;gap:8px;align-items:center;margin-top:8px}
.ed input{width:90px;margin:0;padding:6px 8px;text-align:center}
.alt{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.na{opacity:.55}
a.main{display:block;text-align:center;text-decoration:none}
.tabs{display:none}body{padding-bottom:24px}select{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;margin:0 0 10px}</style>
</head>
<body>
<header><h1>إدارة الصيدلية</h1><p class="sub">صفحة خاصة بالمسؤول</p></header>
<main id="app"></main>
<div id="toast" hidden></div>
<script src="data.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,getDocs,onSnapshot,query,where,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyBKFcbV5Mv-wa0c4iIgIRXIM8nF7Rr5VzE",authDomain:"pharmacy-osama-c4ca2.firebaseapp.com",projectId:"pharmacy-osama-c4ca2",storageBucket:"pharmacy-osama-c4ca2.firebasestorage.app",messagingSenderId:"553534860688",appId:"1:553534860688:web:8a526d58a716c39e539715"});const db=getFirestore(app);const auth=getAuth(app);

const D=window.D,CATS=window.CATS,CL=window.CL;
const IK=['strip','bottle','tube','box'];
const IC={
strip:'<rect x="6" y="14" width="36" height="20" rx="4" fill="#fff" stroke="@" stroke-width="2.5"/><g fill="@"><circle cx="14" cy="21" r="3"/><circle cx="24" cy="21" r="3"/><circle cx="34" cy="21" r="3"/><circle cx="14" cy="28" r="3"/><circle cx="24" cy="28" r="3"/><circle cx="34" cy="28" r="3"/></g>',
bottle:'<rect x="17" y="7" width="14" height="8" rx="2" fill="@"/><rect x="13" y="15" width="22" height="27" rx="6" fill="#fff" stroke="@" stroke-width="2.5"/><rect x="15" y="25" width="18" height="9" fill="@" opacity=".25"/>',
tube:'<path d="M12 11h24l-3 27H15z" fill="#fff" stroke="@" stroke-width="2.5" stroke-linejoin="round"/><rect x="18" y="38" width="12" height="5" rx="1.5" fill="@"/><path d="M18 22h12" stroke="@" stroke-width="2.5" stroke-linecap="round"/>',
box:'<rect x="9" y="14" width="30" height="24" rx="4" fill="#fff" stroke="@" stroke-width="2.5"/><rect x="9" y="14" width="30" height="8" rx="4" fill="@"/><path d="M17 30h14" stroke="@" stroke-width="2.5" stroke-linecap="round"/>'};
const th=(r,z,w)=>`<div class="th" style="width:${w||68}px;height:${w||68}px;background:${CL[r[4]][0]}"><svg viewBox="0 0 48 48" width="${z}" height="${z}" aria-hidden="true">${IC[IK[r[5]]].replace(/@/g,CL[r[4]][1])}</svg></div>`;
const $=s=>document.querySelector(s);
const nz=s=>s.toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
const L=D.map(r=>nz(r[0]+' '+r[1]+' '+r[2]));
const ld=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const fmt=n=>Number(n).toLocaleString('ar-EG');
const rnd=n=>Math.round(n*100)/100;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars=v=>'★'.repeat(Math.round(v))+'☆'.repeat(5-Math.round(v));
let INV={},tt;
const N0=D.length,KEY={},BY={};
D.forEach((r,i)=>{if(r[2]){const k=nz(r[2]);(BY[k]=BY[k]||[]).push(i)}});
const ik=i=>KEY[i]||String(i);
const pr=i=>{const v=INV[ik(i)];return v&&v.p!=null?Number(v.p):D[i][6]};
const qt=i=>{const v=INV[ik(i)];return v&&v.q!=null?Number(v.q):null};
const hid=i=>{const v=INV[ik(i)];return !!(v&&v.h)};
const out=i=>qt(i)!==null&&qt(i)<=0;
function setProds(sn){
 D.length=N0;L.length=N0;for(const k in KEY)delete KEY[k];
 for(const k in BY)BY[k]=BY[k].filter(j=>j<N0);
 sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.no||0)-(b.no||0)).forEach(x=>{
  const i=D.length;D.push([x.e||x.n,x.n,x.s||'',x.m||'',Number(x.c)||0,Number(x.r)||0,Number(x.p)||0,0]);
  KEY[i]='c_'+x.id;L.push(nz(D[i][0]+' '+D[i][1]+' '+D[i][2]));
  if(x.s){const k=nz(x.s);(BY[k]=BY[k]||[]).push(i)}
 });
}
const sp=i=>rnd(pr(i)/D[i][7][0]);
const WA='201027032990',WAU='https://wa.me/',VCN='+201027032990',FEE=20,FREE=5;
const sid=o=>String(o.id).slice(-5).toUpperCase();
const waPh=p=>{let d=String(p).replace(/\D/g,'');if(d.startsWith('0'))d='20'+d.slice(1);return d};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}

const ADMINS=['67ZLg9nutAcbQDj2aeeQaLHAg9y2'],ST=['تم التجهيز','جاهز','في انتظار السائق','تم التسليم'];
let ORD=[],adm='ord',aq='',low=false,first=true,unsubs=[];
const app_=$('#app');
const secs=o=>(o.ts&&o.ts.seconds)||0;
function beep(){let n=0;const go=()=>{try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.25;o.start();setTimeout(()=>{o.stop();c.close()},350)}catch(e){}if(++n<3)setTimeout(go,600)};go();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function loginView(m){return `<form id="lf" style="padding:24px 20px"><h2 style="margin:0 0 16px">تسجيل دخول المسؤول</h2><input name="e" type="email" placeholder="الإيميل" autocomplete="username" required><input name="p" type="password" placeholder="كلمة السر" autocomplete="current-password" required><button class="main">دخول</button>${m?`<p class="empty">${esc(m)}</p>`:''}</form>`}
function ordersHtml(){
 if(!ORD.length)return '<p class="empty">مفيش طلبات لسه.</p>';
 const today=new Date().toDateString(),td=ORD.filter(o=>o.ts&&o.ts.toDate&&o.ts.toDate().toDateString()===today),sales=td.reduce((a,o)=>a+o.tot+o.fee,0);
 return `<p class="cnt">مبيعات النهارده: ${fmt(rnd(sales))} ج (${fmt(td.length)} طلب)</p>`+ORD.map(o=>{
  const nth=ORD.filter(x=>x.ph===o.ph&&secs(x)<=secs(o)).length;
  return `<div class="card"><h4>طلب ${sid(o)} · ${esc(o.n)} <span class="pill">${esc(o.st||'جديد')}</span></h4><small>${esc(o.ph)} · ${esc(o.ad)}<br>${esc(o.pay)} · ${fmt(rnd(o.tot+o.fee))} ج (التوصيل ${o.fee?fmt(o.fee)+' ج':'مجاني'})<br>${o.ts&&o.ts.toDate?o.ts.toDate().toLocaleString('ar-EG'):''} · الطلب رقم ${fmt(nth)} لنفس الرقم${nth<=5?' (ضمن التوصيل المجاني)':''}</small><div>${(o.L||[]).map(x=>`<div>${esc(x.nm)} (${esc(x.l)}) × ${fmt(x.n)} = ${fmt(rnd(x.p*x.n))} ج</div>`).join('')}</div><div class="btns">${ST.map(s=>`<button class="${o.st===s?'on':''}" data-st="${o.id}|${s}">${s}</button>`).join('')}<a href="${WAU}${waPh(o.ph)}?text=${encodeURIComponent('طلبك رقم '+sid(o)+': '+(o.st||'')+' - صيدلية د/أسامه')}" target="_blank" rel="noopener">إبلاغ العميل</a></div></div>`}).join('');
}
function invList(){
 const k=nz(aq),ids=[];
 for(let i=0;i<D.length&&ids.length<30;i++)if(low?(qt(i)!==null&&qt(i)<=5):(!k||L[i].includes(k)))ids.push(i);
 return ids.length?ids.map(i=>`<div class="card"><b><bdi>${esc(D[i][1]||D[i][0])}</bdi></b><br><small><bdi>${esc(D[i][0])}</bdi></small><div class="ed"><span>السعر</span><input type="number" inputmode="decimal" step="0.01" data-ip="${i}" value="${pr(i)}"><span>الكمية</span><input type="number" inputmode="numeric" data-iq="${i}" value="${qt(i)===null?'':qt(i)}" placeholder="—"></div><div class="btns"><button data-hide="${i}">${hid(i)?'إظهار المنتج':'إخفاء المنتج'}</button>${hid(i)?'<span class="pill">مخفي</span>':''}</div></div>`).join(''):'<p class="empty">مفيش نتائج.</p>';
}
function addForm(){return `<form id="pf" style="padding:0 20px"><h3 style="margin:8px 0">إضافة منتج جديد</h3><input name="n" placeholder="اسم المنتج بالعربي" maxlength="120" required><input name="e" placeholder="الاسم بالإنجليزي (اختياري)" maxlength="120"><input name="s" placeholder="المادة الفعالة (اختياري)" maxlength="120"><input name="m" placeholder="الشركة (اختياري)" maxlength="80"><select name="c">${CATS.map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select><select name="r"><option value="3">علبة</option><option value="0">أقراص / كبسولات</option><option value="1">شراب / بخاخ / عبوة</option><option value="2">كريم / مرهم / أنبوبة</option></select><input name="p" type="number" step="0.01" min="0" inputmode="decimal" placeholder="السعر بالجنيه" required><input name="q" type="number" min="0" inputmode="numeric" placeholder="الكمية المتوفرة (اختياري)"><button class="main">إضافة المنتج</button></form>`}
function panel(){
 app_.innerHTML=`<div class="sub2"><button class="chip ${adm==='ord'?'on':''}" data-adm="ord">الطلبات</button><button class="chip ${adm==='inv'?'on':''}" data-adm="inv">المخزون والأسعار</button><button class="chip ${adm==='add'?'on':''}" data-adm="add">إضافة منتج</button><button class="chip" data-out>خروج</button></div>`+(adm==='add'?addForm():adm==='ord'?`<div id="ol">${ordersHtml()}</div>`:`<div style="padding:0 20px"><input id="aq" value="${esc(aq)}" placeholder="ابحث عن منتج لتعديل سعره أو كميته"><label style="display:block;margin:0 0 6px"><input type="checkbox" id="lowc" ${low?'checked':''} style="width:auto;margin:0 0 0 6px"> الناقص فقط (٥ أو أقل)</label></div><div id="il">${invList()}</div><p class="fine">الكمية صفر أو أقل بتخلي المنتج "غير متوفر" عند العملاء. سيب الخانة فاضية لو مش عايز تتابع الكمية.</p>`);
}
function start(){
 first=true;
 unsubs.push(onSnapshot(collection(db,'inv'),sn=>{INV={};sn.docs.forEach(x=>INV[x.id]=x.data())},()=>{}));
 unsubs.push(onSnapshot(collection(db,'prods'),sn=>{setProds(sn);const a=document.activeElement;if(adm==='inv'&&$('#il')&&!(a&&a.closest&&a.closest('#il')))$('#il').innerHTML=invList()},()=>{}));
 unsubs.push(onSnapshot(query(collection(db,'orders'),orderBy('ts','desc'),limit(100)),sn=>{
  if(!first)sn.docChanges().forEach(c=>{if(c.type==='added'){beep();toast('طلب جديد');document.title='● طلب جديد'}});
  first=false;ORD=sn.docs.map(d=>({id:d.id,...d.data()}));
  if(adm==='ord'&&$('#ol'))$('#ol').innerHTML=ordersHtml();else if(adm==='ord')panel();
 },err=>{app_.innerHTML=`<p class="empty">تعذر تحميل الطلبات: ${esc(err.code||'')}</p>`}));
 panel();
}
onAuthStateChanged(auth,u=>{
 unsubs.forEach(f=>f());unsubs=[];
 if(!u){app_.innerHTML=loginView();return}
 if(!ADMINS.includes(u.uid)){app_.innerHTML='<p class="empty">الحساب ده مالوش صلاحية إدارة.</p><div style="padding:0 20px"><button class="main" data-out>تسجيل الخروج</button></div>';return}
 start();
});
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target;
 if(f.id==='pf'){try{const r=await addDoc(collection(db,'prods'),{n:f.n.value.trim(),e:f.e.value.trim(),s:f.s.value.trim(),m:f.m.value.trim(),c:Number(f.c.value),r:Number(f.r.value),p:Number(f.p.value),no:Math.floor(Date.now()/1000)});if(f.q.value!=='')await setDoc(doc(db,'inv','c_'+r.id),{q:Number(f.q.value)},{merge:true});toast('اتضاف المنتج');f.reset()}catch(x){toast('تعذر إضافة المنتج')}return}
 if(f.id!=='lf')return;
 try{await signInWithEmailAndPassword(auth,f.e.value.trim(),f.p.value)}catch(x){app_.innerHTML=loginView('الإيميل أو كلمة السر غلط')}
});
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-adm],[data-st],[data-out],[data-hide]');if(!t)return;const d=t.dataset;
 if('out' in d){signOut(auth);return}
